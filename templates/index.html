<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Agriculture Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Precision Agriculture Assistant</h1>
            <p>AI-Powered Multi-Crop Disease Diagnosis</p>
        </header>

        <main>
            <div class="upload-section" id="drop-zone">
                <div class="icon-container">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 16L12 8" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M9 11L12 8 15 11" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M8 16H16" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </div>
                <h3>Drag & Drop Image Here</h3>
                <p>or</p>
                <label for="file-input" class="custom-file-upload">Browse Files</label>
                <input id="file-input" type="file" accept="image/*" hidden>
            </div>

            <div class="camera-section">
                <button id="camera-btn" class="secondary-btn">Use Camera</button>
                <div id="camera-container" class="hidden">
                    <video id="video" autoplay playsinline></video>
                    <button id="capture-btn" class="primary-btn">Capture</button>
                    <canvas id="canvas" hidden></canvas>
                </div>
            </div>

            <div id="result-section" class="hidden">
                <div class="image-preview">
                    <img id="preview-img" src="" alt="Preview">
                </div>
                <div class="prediction-info">
                    <h2>Diagnosis: <span id="prediction-label">...</span></h2>
                    <div class="confidence-bar-container">
                        <div class="confidence-bar" id="confidence-bar"></div>
                    </div>
                    <p>Confidence: <span id="confidence-score">0%</span></p>
                </div>
                <button id="reset-btn" class="secondary-btn">Analyze Another</button>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Analyzing...</p>
            </div>

            <div class="supported-crops">
                <h3>Supported Crops & Diseases</h3>
                <div class="crop-list">
                    {% if classes %}
                    {% for cls in classes %}
                    <span class="crop-tag">{{ cls }}</span>
                    {% endfor %}
                    {% else %}
                    <p>Loading supported classes...</p>
                    {% endif %}
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
